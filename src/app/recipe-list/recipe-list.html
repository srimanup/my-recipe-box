@if (activeRecipe(); as recipe) {
  <app-recipe-detail [activeRecipe]="recipe" />
} @else {
  <h2>Welcome to my recipe book</h2>
}

<div class="nav">
  <button [disabled]="recipeNumber() < 0" (click)="prevRecipe()">Prev</button>
  <button [disabled]="recipeNumber() === nRecipes - 1" (click)="nextRecipe()">Next</button>
</div>
